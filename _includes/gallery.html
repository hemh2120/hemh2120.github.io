{% assign gallery = site.data.gallery %}

<p class="gallery-intro">
  Outside of research, I recharge through <strong>travel</strong>, <strong>fitness</strong>, and <strong>landscape photography</strong>.
  I've chased auroras at the edge of the earth and I'm already dreaming of the next adventure.
</p>

<div class="gallery-grid">
  {% for item in gallery %}
  <figure class="gallery-item">
    <img src="{{ item.image | relative_url }}" alt="{{ item.caption }} — {{ item.location }}" loading="lazy">
    <figcaption>
      <span class="gallery-caption">{{ item.caption }}</span>
      <span class="gallery-location">{{ item.location }}</span>
    </figcaption>
  </figure>
  {% endfor %}
</div>
