<header class="site-header" id="site-header">
  <div class="wrap header-inner">
    <a href="#about" class="brand">{{ site.data.profile.name | default: site.title }}</a>

    <nav class="site-nav" id="site-nav" aria-label="Main navigation">
      <a href="#about" class="nav-link" data-section="about">About</a>
      <a href="#news" class="nav-link" data-section="news">News</a>
      <a href="#publications" class="nav-link" data-section="publications">Publications</a>
      <a href="#experience" class="nav-link" data-section="experience">Experience</a>
      <a href="#misc" class="nav-link" data-section="misc">Misc</a>
    </nav>

    <div class="header-actions">
      <button type="button" class="icon-btn" id="theme-toggle" aria-label="Toggle color theme">
        <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>

      <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="site-nav">
        <svg class="icon icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16"></path>
        </svg>
        <svg class="icon icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"></path>
        </svg>
      </button>
    </div>
  </div>
</header>
