name: Update citation counts

on:
  schedule:
    # 00:30 UTC daily, 08:30 in China. Numbers change slowly; once a day is enough.
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Google Scholar metrics
        run: python scripts/update_citations.py

      - name: Commit updated counts
        run: |
          git add citations.json
          if git diff --cached --quiet; then
            echo "Citation counts unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Google Scholar citation counts"
          git push
