# Site settings
title: "Minghua (Ricardo) He"
description: "Graduate student at Peking University working on foundation models and reliable infrastructure."
url: "https://hemh2120.github.io"
baseurl: ""

# Author info
author:
  name: "Minghua He"
  email: "hemh2120@gmail.com"

# Build settings
markdown: kramdown
highlighter: rouge

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor

# Include files
include:
  - _pages

# Plugins (GitHub Pages compatible)
plugins:
  - jekyll-seo-tag

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
