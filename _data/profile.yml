bio: |
  I am currently a graduate student at <a href="https://english.pku.edu.cn/" class="bio-link">Peking University</a>, the National Engineering Research Center for Software Engineering. 
  
  I've also had great experiences working at <a href="https://www.tencent.com/en-us/" class="bio-link">WeLM Team, WeChat AI</a>, <a href="https://www.microsoft.com/en-us/research/lab/microsoft-research-asia/" class="bio-link">Microsoft Research Asia</a> and <a href="https://www.alibabagroup.com/en-US" class="bio-link">Alibaba Group</a>. 
  
  My research interest is broadly in <strong>Foundation Models</strong> and <strong>Reliable Infrastructure</strong>. 
  
  <br>
  <br>

  My research vision is to <strong>scale large language models with efficiency and reliability</strong>: rethinking model architectures and generation paradigms so that efficiency survives scale, and building ever-larger training and inference systems that remain stable and dependable.



